<!doctype html>
<!-- Fictional fixture modeled on a Workday apply flow: three steps, a custom listbox, a review page. -->
<html><head><meta charset="utf-8"><title>Acme Careers</title></head>
<body>
<div id="app"></div>
<script>
  window.__submitClicks = 0;
  const steps = [
    `<div data-automation-id="applyFlowPage"><h2 data-automation-id="progressBarActiveStep">My Information</h2>
      <div data-automation-id="formField-firstName"><label for="fn">Given Name(s)</label><input id="fn" data-automation-id="legalNameSection_firstName"></div>
      <div data-automation-id="formField-email"><label for="em">Email Address</label><input id="em" data-automation-id="email"></div>
      <div data-automation-id="formField-source"><label>How Did You Hear About Us?</label><button type="button" aria-haspopup="listbox" id="src">Select One</button></div>
      <button data-automation-id="pageFooterNextButton" type="button">Save and Continue</button></div>`,
    `<div data-automation-id="applyFlowPage"><h2 data-automation-id="progressBarActiveStep">My Experience</h2>
      <div data-automation-id="formField-resume"><label for="up">Resume/CV</label><input id="up" type="file" data-automation-id="file-upload-input-ref"></div>
      <button data-automation-id="pageFooterNextButton" type="button">Save and Continue</button></div>`,
    `<div data-automation-id="applyFlowPage"><h2 data-automation-id="progressBarActiveStep">Review</h2>
      <div data-automation-id="reviewJobApplicationPage">Review your application.</div>
      <button data-automation-id="pageFooterSubmitButton" type="button">Submit</button></div>`,
  ];
  let i = 0;
  const values = {};
  function render() {
    document.getElementById("app").innerHTML = steps[i];
    const next = document.querySelector("[data-automation-id=pageFooterNextButton]");
    if (next) next.addEventListener("click", () => {
      document.querySelectorAll("input:not([type=file])").forEach((el) => (values[el.id] = el.value));
      // Like Workday, the next step renders a moment later.
      setTimeout(() => { i++; render(); }, 150);
    });
    const submit = document.querySelector("[data-automation-id=pageFooterSubmitButton]");
    if (submit) submit.addEventListener("click", () => { window.__submitClicks++; });
    const src = document.getElementById("src");
    if (src) src.addEventListener("click", () => {
      setTimeout(() => {
        const list = document.createElement("ul");
        list.setAttribute("role", "listbox");
        for (const t of ["Job Board", "Referral", "Other"]) {
          const li = document.createElement("li");
          li.setAttribute("role", "option");
          li.textContent = t;
          li.addEventListener("click", () => { src.textContent = t; values.src = t; list.remove(); });
          list.append(li);
        }
        document.body.append(list);
      }, 100);
    });
  }
  window.__values = values;
  render();
</script>
</body></html>
