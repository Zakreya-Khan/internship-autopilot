<!doctype html>
<!-- Fictional fixture modeled on an Ashby application form (React app). -->
<html><head><meta charset="utf-8"><title>Acme - Engineering Intern</title></head>
<body>
<div class="ashby-application-form-container">
<form class="ashby-application-form">
  <div class="ashby-application-form-field-entry"><label for="_systemfield_name">Name</label><input id="_systemfield_name" name="_systemfield_name" type="text"></div>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_email">Email</label><input id="_systemfield_email" name="_systemfield_email" type="email"></div>
  <div class="ashby-application-form-field-entry"><label for="_systemfield_resume">Resume</label><input id="_systemfield_resume" name="_systemfield_resume" type="file"></div>
  <div class="ashby-application-form-field-entry">
    <label>Are you able to work in person in New York?</label>
    <div><button type="button">Yes</button><button type="button">No</button></div>
  </div>
  <div class="ashby-application-form-field-entry"><label for="q_why">What interests you about this role?</label><textarea id="q_why"></textarea></div>
  <button type="submit" class="ashby-application-form-submit-button">Submit Application</button>
</form>
</div>
</body></html>
