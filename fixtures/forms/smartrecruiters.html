<!doctype html>
<!-- Fictional fixture modeled on a SmartRecruiters one-click application form. -->
<html><head><meta charset="utf-8"><title>Acme - Software Intern</title></head>
<body>
<oc-oneclick-form>
<form>
  <div class="field"><label for="first-name-input">First name</label><input id="first-name-input" name="firstName"></div>
  <div class="field"><label for="last-name-input">Last name</label><input id="last-name-input" name="lastName"></div>
  <div class="field"><label for="email-input">Email</label><input id="email-input" name="email" type="email"></div>
  <div class="field"><label for="confirm-email-input">Confirm your email</label><input id="confirm-email-input" name="confirmEmail" type="email"></div>
  <div class="field"><label for="phone-number-input">Phone number</label><input id="phone-number-input" name="phoneNumber"></div>
  <div class="field"><label for="file-upload">Resume</label><input id="file-upload" name="resume" type="file"></div>
  <button type="submit">Submit</button>
</form>
</oc-oneclick-form>
</body></html>
