<!doctype html>
<!-- Fictional fixture: a home-grown careers page no adapter knows. -->
<html><head><meta charset="utf-8"><title>Small Startup - Apply</title></head>
<body>
<header><form role="search"><input name="q" placeholder="Search jobs"></form></header>
<main>
<h1>Apply: Software Intern</h1>
<form id="apply">
  <p><label for="a1">Your full name</label><input id="a1" name="fullname" required></p>
  <p><label for="a2">E-mail</label><input id="a2" name="mail" type="email" required></p>
  <p><label for="a3">Account password</label><input id="a3" name="pw" type="password"></p>
  <p><label for="a4">CV upload</label><input id="a4" name="cv" type="file"></p>
  <fieldset><legend>Do you need visa sponsorship?</legend>
    <label><input type="radio" name="visa" value="y"> Yes</label>
    <label><input type="radio" name="visa" value="n"> No</label></fieldset>
  <p><label for="a5">Tell us about a project you're proud of</label><textarea id="a5" name="proud"></textarea></p>
  <p><label for="a6">Favourite snack</label><input id="a6" name="snack"></p>
  <button type="submit">Send application</button>
</form>
</main>
</body></html>
